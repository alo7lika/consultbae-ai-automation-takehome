<!doctype html><title>ConsultBae Audio Collection</title><style>body{font:16px system-ui;max-width:680px;margin:3rem auto;padding:0 1rem}input,button{padding:.7rem;margin:.35rem 0;width:100%;box-sizing:border-box}button{cursor:pointer}#rec{width:auto}audio{width:100%}</style>
<h1>Audio collection</h1><p>Upload a recording or record one in your browser.</p><form method="post" action="/submit" enctype="multipart/form-data"><label>Name<input required name="name" autocomplete="name"></label><label>Phone<input required name="phone" inputmode="tel" placeholder="9000000000"></label><label>Email (optional)<input name="email" type="email"></label><label>Audio file<input id="file" required name="audio" type="file" accept="audio/*"></label><button id="rec" type="button">Record audio</button><audio id="preview" controls hidden></audio><button>Submit audio</button></form><p><a href="/submissions">View submissions</a></p><script>let recorder,chunks=[];const button=document.querySelector('#rec'),file=document.querySelector('#file'),preview=document.querySelector('#preview');button.onclick=async()=>{if(!recorder||recorder.state==='inactive'){let stream=await navigator.mediaDevices.getUserMedia({audio:true});recorder=new MediaRecorder(stream);chunks=[];recorder.ondataavailable=e=>chunks.push(e.data);recorder.onstop=()=>{let blob=new Blob(chunks,{type:recorder.mimeType});let f=new File([blob],'recording.webm',{type:blob.type});let dt=new DataTransfer();dt.items.add(f);file.files=dt.files;preview.src=URL.createObjectURL(blob);preview.hidden=false;button.textContent='Record audio'};recorder.start();button.textContent='Stop recording'}else recorder.stop()}</script>
